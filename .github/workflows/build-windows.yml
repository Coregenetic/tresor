name: Windows-Build

# - Push auf main: Installer bauen und als Artifact bereitstellen (zum Testen)
# - Tag v* (z. B. v0.5.0): Release veröffentlichen – installierte Apps aktualisieren sich dann selbst
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Signatur für automatische Updates (Repo → Settings → Secrets and variables → Actions)
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Signaturschlüssel prüfen
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY fehlt – siehe README, Abschnitt 'Updates einrichten'."
            exit 1
          fi

      # Normaler Build (main)
      - name: App bauen
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx tauri build

      - name: Installer hochladen
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Tresor-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Release (Tag) – erzeugt auch latest.json für die automatischen Updates
      - name: Release veröffentlichen
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Tresor ${{ github.ref_name }}"
          releaseBody: "Neue Version von Tresor. Installierte Apps aktualisieren sich beim nächsten Start selbst."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
